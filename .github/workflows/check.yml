name: SSTP Node Pipeline

on:
  workflow_dispatch:
    inputs:
      max_test_nodes:
        description: '最多检测多少个节点（0 = 全部）'
        required: false
        default: '0'
      concurrency:
        description: '检测并发数（建议 16–32）'
        required: false
        default: '20'
      timeout:
        description: '单节点检测超时（秒）'
        required: false
        default: '30'

permissions:
  contents: write

# 同一时间只跑一个流水线，避免两次运行互相抢推产物
concurrency:
  group: sstpnode-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          MAX_TEST_NODES: ${{ github.event.inputs.max_test_nodes || '0' }}
          CHECK_CONCURRENCY: ${{ github.event.inputs.concurrency || '20' }}
          CHECK_TIMEOUT: ${{ github.event.inputs.timeout || '30' }}
        run: python pipeline.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add node-collect.txt node-tests.csv node.txt
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
          else
            git commit -m "Update node pipeline outputs"
            # 运行期间远端可能有新提交：推送被拒时先 rebase 到最新 main 再重试，
            # 三个产物文件如有冲突，以本次新生成的结果为准
            for i in 1 2 3; do
              if git push; then
                break
              fi
              if [ "$i" = "3" ]; then
                echo "推送重试 3 次仍失败"
                exit 1
              fi
              git fetch origin main
              git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
            done
          fi
